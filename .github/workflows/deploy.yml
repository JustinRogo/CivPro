name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Publication status
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - reviewed
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run validate && npm test
      - name: Build public preview
        if: github.event_name == 'push' || inputs.release == 'candidate'
        run: npm run build -- --candidate
        env:
          FCR_SITE_URL: ${{ vars.FCR_SITE_URL }}
      - name: Build reviewed production artifact
        if: inputs.release == 'reviewed'
        run: npm run build -- --production
        env:
          FCR_SITE_URL: ${{ vars.FCR_SITE_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
